        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --card-bg: #1e293b;
            --nav-height: 70px;
            --header-height: 80vh;
        }

        * {

            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }

        .nav-link:hover {
            color: var(--text-primary);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .cta-button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-decoration: none;
        }

        .cta-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* Header */
        header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .header-content {

            z-index: 1;

        .header-title {

            line-height: 1.2;

        }

        .header-description {

        .header-cta {

            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-decoration: none;

        .secondary-button:hover {
            background-color: rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);

        /* Background Animation */

            font-weight: 700;
            margin-bottom: 3rem;
            text-align: center;

        .features-grid {
            display: grid;

        .feature-card {

            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

            }

            }

            .footer-content {

            top: 0;
            right: 0;
            z-index: 0;

        .simulation-title {
            font-size: 1.8rem;

            cursor: pointer;

        .sim-button:hover {

            color: var(--text-primary);

        }

        .slider {
            width: 100%;

            background: var(--bg-secondary);
            border-radius: 2px;
            appearance: none;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;

        .slider::-webkit-slider-thumb:hover {

            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border: none;
        }

        .slider::-moz-range-thumb:hover {
            background: var(--accent-hover);
        }

        .kinematics-data {
            margin-top: 1.5rem;
            padding-top: 1rem;

        }

        .data-title {
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .data-item {
            background: rgba(15, 23, 42, 0.3);
            padding: 0.5rem;
            border-radius: 0.375rem;
        }

        .data-label {
            color: var(--text-secondary);
            font-size: 0.75rem;

            margin-bottom: 0.25rem;
        }

        .data-value {
            color: var(--accent);
            font-weight: 500;
            font-size: 0.875rem;
        }

    <!-- JavaScript for background animation -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const canvas = document.getElementById('physicsCanvas');
            const ctx = canvas.getContext('2d');

            // Make canvas fill the container
            function resizeCanvas() {
                const container = document.querySelector('.bg-animation');
                canvas.width = container.offsetWidth;
                canvas.height = container.offsetHeight;
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Mouse position tracking
            let mouse = {
                x: null,
                y: null,
                radius: 150
            };

            window.addEventListener('mousemove', function (event) {
                // Get mouse position relative to canvas
                const rect = canvas.getBoundingClientRect();
                mouse.x = event.clientX - rect.left;
                mouse.y = event.clientY - rect.top;
            });

            // Particle class with enhanced tech aesthetics
            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.baseX = x; // For returning to original position
                    this.baseY = y;
                    this.density = (Math.random() * 30) + 1;
                    this.size = Math.random() * 3 + 1;
                    this.color = this.getRandomColor();

                    // Velocity for drift motion
                    this.vx = Math.random() * 0.4 - 0.2;
                    this.vy = Math.random() * 0.4 - 0.2;

                    // Physics properties 
                    this.friction = 0.95;
                    this.gravity = 0.01;

                    // For connections
                    this.maxConnections = 3;
                    this.connections = [];
                }

                getRandomColor() {
                    // Techy color palette
                    const colors = [
                        'rgba(59, 130, 246, 0.7)',  // Blue
                        'rgba(99, 102, 241, 0.7)',  // Indigo
                        'rgba(16, 185, 129, 0.7)',  // Emerald
                        'rgba(6, 182, 212, 0.7)',   // Cyan
                        'rgba(124, 58, 237, 0.7)'   // Violet
                    ];
                    return colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    // Drift motion
                    this.x += this.vx;
                    this.y += this.vy;

                    // Gentle bounce at borders
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                    // Mouse interaction
                    if (mouse.x != null && mouse.y != null) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < mouse.radius) {
                            // Calculate force direction
                            const forceDirectionX = dx / distance;
                            const forceDirectionY = dy / distance;

                            // Calculate force strength based on distance
                            const force = (mouse.radius - distance) / mouse.radius;

                            // Dynamic color change on mouse hover
                            this.color = `rgba(${24 + Math.random() * 50}, ${144 + Math.random() * 50}, ${255}, ${0.7 + force * 0.3})`;

                            // Apply force (attraction to mouse)
                            const dirX = forceDirectionX * force * this.density;
                            const dirY = forceDirectionY * force * this.density;

                            this.x += dirX;
                            this.y += dirY;
                        } else {
                            // Gradually return to original color
                            this.color = this.getRandomColor();
                        }
                    }
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }

                connect(particles) {
                    this.connections = [];

                    // Fixed connection distance
                    const connectionDist = 100;

                    particles.forEach(particle => {
                        if (particle === this) return;

                        const distance = Math.sqrt(
                            Math.pow(this.x - particle.x, 2) +
                            Math.pow(this.y - particle.y, 2)
                        );

                        // Dynamic connection distance based on mouse position
                        let connectionDistance = connectionDist;

                        if (mouse.x != null && mouse.y != null) {
                            const mouseDistanceToThis = Math.sqrt(
                                Math.pow(mouse.x - this.x, 2) +
                                Math.pow(mouse.y - this.y, 2)
                            );

                            if (mouseDistanceToThis < mouse.radius) {
                                connectionDistance = 150; // Increase connection distance near mouse
                            }
                        }

                        if (distance < connectionDistance) {
                            this.connections.push({
                                particle,
                                distance
                            });
                        }
                    });

                    // Sort by distance and keep only maxConnections
                    this.connections.sort((a, b) => a.distance - b.distance);
                    this.connections = this.connections.slice(0, this.maxConnections);

                    // Draw enhanced connections
                    this.connections.forEach(connection => {
                        ctx.beginPath();
                        ctx.moveTo(this.x, this.y);
                        ctx.lineTo(connection.particle.x, connection.particle.y);

                        // Dynamic line width and color based on distance
                        const opacity = 1 - connection.distance / connectionDist;
                        const lineWidth = opacity * 2;

                        // Check if mouse is near this connection
                        let lineColor = `rgba(59, 130, 246, ${opacity * 0.4})`;

                        if (mouse.x != null && mouse.y != null) {
                            const mouseToLine = distToSegment(
                                { x: mouse.x, y: mouse.y },
                                { x: this.x, y: this.y },
                                { x: connection.particle.x, y: connection.particle.y }
                            );

                            if (mouseToLine < 50) {
                                // Highlight lines near mouse
                                lineColor = `rgba(99, 102, 241, ${Math.min(1, opacity * 0.8 + 0.2)})`;
                            }
                        }

                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = lineWidth;
                        ctx.stroke();
                    });
                }
            }

            // Helper function to calculate distance from point to line segment
            function sqr(x) { return x * x }
            function dist2(v, w) { return sqr(v.x - w.x) + sqr(v.y - w.y) }

            function distToSegmentSquared(p, v, w) {
                const l2 = dist2(v, w);
                if (l2 === 0) return dist2(p, v);
                let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
                t = Math.max(0, Math.min(1, t));
                return dist2(p, {
                    x: v.x + t * (w.x - v.x),
                    y: v.y + t * (w.y - v.y)
                });
            }

            function distToSegment(p, v, w) {
                return Math.sqrt(distToSegmentSquared(p, v, w));
            }

            // Create particles with an improved distribution
            const particles = [];
            const particleCount = 80; // More particles for a denser network

            function createParticles() {
                for (let i = 0; i < particleCount; i++) {
                    // Create grid-like distribution with some randomness
                    const gridSize = Math.sqrt(particleCount);
                    const cellWidth = canvas.width / gridSize;
                    const cellHeight = canvas.height / gridSize;

                    const gridX = i % gridSize;
                    const gridY = Math.floor(i / gridSize);

                    const x = (gridX * cellWidth) + (Math.random() * cellWidth);
                    const y = (gridY * cellHeight) + (Math.random() * cellHeight);

                    particles.push(new Particle(x, y));
                }
            }

            createParticles();

            // Add digital circuit effect (tech lines in background)
            function drawCircuitLines() {
                const lineCount = 8;
                const lineWidth = 1;
                const lineSpacing = canvas.height / lineCount;

                ctx.strokeStyle = 'rgba(59, 130, 246, 0.1)';
                ctx.lineWidth = lineWidth;

                // Horizontal lines
                for (let i = 0; i < lineCount; i++) {
                    const y = i * lineSpacing;

                    ctx.beginPath();
                    ctx.moveTo(0, y);

                    // Create zigzags
                    const segments = Math.floor(Math.random() * 5) + 5;
                    const segmentWidth = canvas.width / segments;

                    for (let j = 0; j <= segments; j++) {
                        const x = j * segmentWidth;
                        const yOffset = (j % 2 === 0) ? 0 : Math.random() * 20 - 10;
                        ctx.lineTo(x, y + yOffset);
                    }

                    ctx.stroke();
                }

                // Vertical lines
                const vLineCount = 12;
                const vLineSpacing = canvas.width / vLineCount;

                for (let i = 0; i < vLineCount; i++) {
                    const x = i * vLineSpacing;

                    ctx.beginPath();
                    ctx.moveTo(x, 0);

                    // Create zigzags
                    const segments = Math.floor(Math.random() * 5) + 5;
                    const segmentHeight = canvas.height / segments;

                    for (let j = 0; j <= segments; j++) {
                        const y = j * segmentHeight;
                        const xOffset = (j % 2 === 0) ? 0 : Math.random() * 20 - 10;
                        ctx.lineTo(x + xOffset, y);
                    }

                    ctx.stroke();
                }

                // Add some nodes at intersections
                ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
                for (let i = 0; i < 15; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    const size = Math.random() * 3 + 2;

                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Animation loop with enhanced effects
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw tech background
                drawCircuitLines();

                // Update and draw particles
                particles.forEach(particle => {
                    particle.update();
                    particle.draw();
                    particle.connect(particles);
                });

                // Draw mouse interaction area
                if (mouse.x != null && mouse.y != null) {
                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(99, 102, 241, 0.8)';
                    ctx.fill();

                    // Pulse effect around mouse
                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(99, 102, 241, 0.15)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                requestAnimationFrame(animate);
            }

            animate();

            // Reset mouse position when mouse leaves canvas
            canvas.addEventListener('mouseleave', function () {
                mouse.x = null;
                mouse.y = null;
            });

            // Make particles move away on click (physics simulation)
            canvas.addEventListener('click', function (event) {
                const rect = canvas.getBoundingClientRect();
                const clickX = event.clientX - rect.left;
                const clickY = event.clientY - rect.top;

                // Apply force to particles
                particles.forEach(particle => {
                    const dx = particle.x - clickX;
                    const dy = particle.y - clickY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        const angle = Math.atan2(dy, dx);
                        const force = (150 - distance) / 10;

                        particle.vx += Math.cos(angle) * force;
                        particle.vy += Math.sin(angle) * force;
                    }
                });
            });

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('kinematics-simulation');

            // Three.js setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e293b);

            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(15, 10, 15);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // OrbitControls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Ground plane
            const groundGeometry = new THREE.PlaneGeometry(40, 40, 20, 20);
            const groundMaterial = new THREE.MeshPhongMaterial({
                color: 0x3b82f6,
                side: THREE.DoubleSide,
                wireframe: false
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grid helper
            const gridHelper = new THREE.GridHelper(40, 40, 0x94a3b8, 0x94a3b8);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // Projectile
            const projectileGeometry = new THREE.SphereGeometry(0.2, 32, 32);
            const projectileMaterial = new THREE.MeshPhongMaterial({
                color: 0x60a5fa,
                shininess: 100
            });
            const projectile = new THREE.Mesh(projectileGeometry, projectileMaterial);
            projectile.castShadow = true;
            scene.add(projectile);

            // Trail
            let trailPoints = [];
            const trailGeometry = new THREE.BufferGeometry();
            const trailMaterial = new THREE.LineBasicMaterial({
                color: 0x60a5fa,
                opacity: 0.5,
                transparent: true
            });
            const trail = new THREE.Line(trailGeometry, trailMaterial);
            scene.add(trail);
            let showTrail = true;

            // Predicted trajectory
            const trajectoryPoints = [];
            const trajectoryGeometry = new THREE.BufferGeometry();
            const trajectoryMaterial = new THREE.LineDashedMaterial({
                color: 0x94a3b8,
                dashSize: 0.5,
                gapSize: 0.3,
                opacity: 0.3,
                transparent: true
            });
            const trajectory = new THREE.Line(trajectoryGeometry, trajectoryMaterial);
            scene.add(trajectory);

            // Physics parameters
            const params = {
                velocityX: 10.0,
                velocityY: 15.0,
                velocityZ: 0.0,
                height: 0,
                gravity: 9.81,
                time: 0,
                isLaunched: false
            };

            let maxHeight = 0;
            let distance = 0;

            // Calculate trajectory points
            function calculateTrajectory() {
                trajectoryPoints.length = 0;
                const v0x = params.velocityX;
                const v0y = params.velocityY;
                const v0z = params.velocityZ;

                // Calculate time of flight (when projectile hits the ground)
                const timeOfFlight = (v0y + Math.sqrt(v0y * v0y + 2 * params.gravity * params.height)) / params.gravity;

                // Generate trajectory points
                for (let t = 0; t <= timeOfFlight; t += timeOfFlight / 50) {
                    const x = v0x * t;
                    const y = params.height + v0y * t - 0.5 * params.gravity * t * t;
                    const z = v0z * t;
                    trajectoryPoints.push(new THREE.Vector3(x, y, z));
                }

                // Update trajectory line
                trajectoryGeometry.setFromPoints(trajectoryPoints);
                trajectory.computeLineDistances();
            }

            // Update projectile position
            function updateProjectile() {
                if (!params.isLaunched) return;

                const v0x = params.velocityX;
                const v0y = params.velocityY;
                const v0z = params.velocityZ;

                // Current position
                const x = v0x * params.time;
                const y = params.height + v0y * params.time - 0.5 * params.gravity * params.time * params.time;
                const z = v0z * params.time;

                // Current velocity components
                const vx = v0x;
                const vy = v0y - params.gravity * params.time;
                const vz = v0z;
                const currentSpeed = Math.sqrt(vx * vx + vy * vy + vz * vz);

                // Update position
                projectile.position.set(x, y, z);

                // Update trail
                if (showTrail) {
                    trailPoints.push(new THREE.Vector3(x, y, z));
                    trailGeometry.setFromPoints(trailPoints);
                }

                // Update max height and distance
                maxHeight = Math.max(maxHeight, y);
                distance = Math.sqrt(x * x + z * z);

                // Update data display
                document.getElementById('time-value').textContent = params.time.toFixed(2) + ' s';
                document.getElementById('distance-value').textContent = distance.toFixed(2) + ' m';
                document.getElementById('max-height-value').textContent = maxHeight.toFixed(2) + ' m';
                document.getElementById('current-speed-value').textContent = currentSpeed.toFixed(2) + ' m/s';

                // Check if projectile has hit the ground
                if (y <= 0) {
                    params.isLaunched = false;
                    projectile.position.y = 0;
                } else {
                    params.time += 0.016; // Approximately 60 FPS
                }
            }

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                updateProjectile();
                controls.update();
                renderer.render(scene, camera);
            }

            // Event listeners
            document.getElementById('velocity-x-slider').addEventListener('input', function (e) {
                params.velocityX = parseFloat(e.target.value);
                document.getElementById('velocity-x-value').textContent = params.velocityX.toFixed(1);
                calculateTrajectory();
            });

            document.getElementById('velocity-y-slider').addEventListener('input', function (e) {
                params.velocityY = parseFloat(e.target.value);
                document.getElementById('velocity-y-value').textContent = params.velocityY.toFixed(1);
                calculateTrajectory();
            });

            document.getElementById('velocity-z-slider').addEventListener('input', function (e) {
                params.velocityZ = parseFloat(e.target.value);
                document.getElementById('velocity-z-value').textContent = params.velocityZ.toFixed(1);
                calculateTrajectory();
            });

            document.getElementById('height-slider').addEventListener('input', function (e) {
                params.height = parseFloat(e.target.value);
                document.getElementById('height-value').textContent = params.height.toFixed(1);
                projectile.position.y = params.height;
                calculateTrajectory();
            });

            // document.getElementById('launch-projectile').addEventListener('click', function () {
            //     if (!params.isLaunched) {
            //         params.isLaunched = true;
            //         params.time = 0;
            //         maxHeight = params.height;
            //         distance = 0;
            //         trailPoints.length = 0;
            //         projectile.position.set(0, params.height, 0);
            //     }
            // });

            // document.getElementById('reset-kinematics').addEventListener('click', function () {
            //     params.isLaunched = false;
            //     params.time = 0;
            //     params.velocityX = 10.0;
            //     params.velocityY = 15.0;
            //     params.velocityZ = 0.0;
            //     params.height = 0;
            //     maxHeight = 0;
            //     distance = 0;
            //     trailPoints.length = 0;

            //     // Reset projectile position
            //     projectile.position.set(0, params.height, 0);

            //     // Reset sliders and displays
            //     document.getElementById('velocity-x-slider').value = params.velocityX;
            //     document.getElementById('velocity-y-slider').value = params.velocityY;
            //     document.getElementById('velocity-z-slider').value = params.velocityZ;
            //     document.getElementById('height-slider').value = params.height;

            //     document.getElementById('velocity-x-value').textContent = params.velocityX.toFixed(1);
            //     document.getElementById('velocity-y-value').textContent = params.velocityY.toFixed(1);
            //     document.getElementById('velocity-z-value').textContent = params.velocityZ.toFixed(1);
            //     document.getElementById('height-value').textContent = params.height.toFixed(1);

            //     document.getElementById('time-value').textContent = '0.00 s';
            //     document.getElementById('distance-value').textContent = '0.00 m';
            //     document.getElementById('max-height-value').textContent = '0.00 m';
            //     document.getElementById('current-speed-value').textContent = '0.00 m/s';

            //     calculateTrajectory();
            // });

            // Handle window resize
            window.addEventListener('resize', function () {
                const width = container.clientWidth;
                const height = container.clientHeight;

                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            });

            // Initial trajectory calculation
            calculateTrajectory();

            // Start animation loop
            animate();
        });
    </script>
