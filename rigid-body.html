<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysLab | Interactive Physics Simulations</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Cannon.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <!-- OrbitControls for Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --card-bg: #1e293b;
            --nav-height: 70px;
            --header-height: 80vh;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .logo span {
            color: var(--accent);
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        
        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            position: relative;
            transition: color 0.3s ease;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }
        
        .nav-link:hover {
            color: var(--text-primary);
        }
        
        .nav-link:hover::after {
            width: 100%;
        }
        
        .cta-button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-decoration: none;
        }
        
        .cta-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }
        
        /* Header */
        header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .header-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1.5rem;
            width: 100%;
            max-width: 650px;
            z-index: 1;
        }
        
        .header-title {
            font-size: 3.5rem;
            line-height: 1.2;
            font-weight: 800;
        }
        
        .header-description {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        
        .header-cta {
            display: flex;
            gap: 1rem;
        }
        
        .secondary-button {
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-decoration: none;
        }
        
        .secondary-button:hover {
            background-color: rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }
        
        /* Background Animation */
        .bg-animation {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            z-index: 0;
            opacity: 0.5;
        }
        
        /* Features Section */
        .features {
            padding: 6rem 0;
        }
        
        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            text-align: center;
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .feature-card {
            background-color: var(--card-bg);
            border-radius: 0.75rem;
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }
        
        .feature-icon {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }
        
        .feature-title {
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }
        
        .feature-description {
            color: var(--text-secondary);
        }
        
        /* Footer */
        footer {
            background-color: var(--bg-secondary);
            padding: 3rem 0;
            margin-top: 4rem;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .footer-links {
            display: flex;
            gap: 2rem;
        }
        
        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .footer-link:hover {
            color: var(--text-primary);
        }
        
        .copyright {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .header-title {
                font-size: 2.5rem;
            }
            
            .header-description {
                font-size: 1rem;
            }
            
            .bg-animation {
                width: 80%;
            }
            
            .footer-content {
                flex-direction: column;
                gap: 2rem;
            }
        }

        /* Canvas animation */
        canvas {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 0;
        }

        /* Simulation Styles */
        .simulation-container {
            margin-bottom: 4rem;
        }

        .simulation-title {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .sim-button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-size: 0.875rem;
        }

        .sim-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .sim-button:active {
            transform: translateY(0);
        }

        /* Simulation Controls */
        .physics-controls {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(15, 23, 42, 0.9);
            padding: 1rem;
            border-radius: 0.75rem;
            width: 250px;
            z-index: 10;
        }

        .control-group {
            margin-bottom: 1rem;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .control-value {
            color: var(--accent);
            font-weight: 500;
        }

        .slider {
            width: 100%;
            height: 4px;
            background: var(--bg-secondary);
            border-radius: 2px;
            appearance: none;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            background: var(--accent-hover);
        }

        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border: none;
        }

        .slider::-moz-range-thumb:hover {
            background: var(--accent-hover);
        }

        .kinematics-data {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-title {
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .data-item {
            background: rgba(15, 23, 42, 0.3);
            padding: 0.5rem;
            border-radius: 0.375rem;
        }

        .data-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            display: block;
            margin-bottom: 0.25rem;
        }

        .data-value {
            color: var(--accent);
            font-weight: 500;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>

<div class="simulation-container">
    <h3 class="simulation-title">3D Physics Lab</h3>
    <div id="rigid-body-simulation" style="width: 100%; height: 500px; background: var(--card-bg); border-radius: 0.75rem; overflow: hidden; margin-bottom: 2rem; position: relative;">
        <!-- Controls -->
        <div class="simulation-controls" style="position: absolute; top: 1rem; left: 1rem; z-index: 10; display: flex; gap: 0.5rem; flex-wrap: wrap; max-width: 100%; padding: 0.5rem;">
            <button id="add-cube" class="sim-button">Add Cube</button>
            <button id="add-sphere" class="sim-button">Add Sphere</button>
            <button id="add-cylinder" class="sim-button">Add Cylinder</button>
            <button id="toggle-gravity" class="sim-button">Toggle Gravity</button>
            <button id="reset-simulation" class="sim-button">Reset</button>
        </div>

        <!-- Physics Controls -->
        <div class="physics-controls">
            <div class="control-group">
                <div class="control-label">
                    <span>Gravity</span>
                    <span class="control-value" id="gravity-value">9.82</span>
                </div>
                <input type="range" id="gravity-slider" class="slider" 
                    min="0" max="20" step="0.1" value="9.82">
            </div>
            <div class="control-group">
                <div class="control-label">
                    <span>Friction</span>
                    <span class="control-value" id="friction-value">0.3</span>
                </div>
                <input type="range" id="friction-slider" class="slider" 
                    min="0" max="1" step="0.05" value="0.3">
            </div>
            <div class="control-group">
                <div class="control-label">
                    <span>Restitution</span>
                    <span class="control-value" id="restitution-value">0.7</span>
                </div>
                <input type="range" id="restitution-slider" class="slider" 
                    min="0" max="1" step="0.05" value="0.7">
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Scene setup
        const container = document.getElementById('rigid-body-simulation');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -10;
        directionalLight.shadow.camera.right = 10;
        directionalLight.shadow.camera.top = 10;
        directionalLight.shadow.camera.bottom = -10;
        scene.add(directionalLight);

        // Camera position
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        // OrbitControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Physics world
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 10;

        // Physics materials
        const defaultMaterial = new CANNON.Material('default');
        const defaultContact = new CANNON.ContactMaterial(
            defaultMaterial,
            defaultMaterial,
            {
                friction: 0.3,
                restitution: 0.7
            }
        );
        world.addContactMaterial(defaultContact);
        world.defaultContactMaterial = defaultContact;

        // Ground
        const groundShape = new CANNON.Plane();
        const groundBody = new CANNON.Body({ 
            mass: 0,
            material: defaultMaterial
        });
        groundBody.addShape(groundShape);
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(groundBody);

        // Ground mesh
        const groundGeometry = new THREE.PlaneGeometry(20, 20);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x3b82f6,
            metalness: 0.3,
            roughness: 0.4
        });
        const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
        groundMesh.receiveShadow = true;
        groundMesh.rotation.x = -Math.PI / 2;
        scene.add(groundMesh);

        // Walls
        const wallShape = new CANNON.Box(new CANNON.Vec3(10, 5, 0.5));
        
        // Back wall
        const backWallBody = new CANNON.Body({ 
            mass: 0,
            material: defaultMaterial
        });
        backWallBody.addShape(wallShape);
        backWallBody.position.set(0, 5, -10);
        world.addBody(backWallBody);

        // Back wall mesh
        const wallGeometry = new THREE.BoxGeometry(20, 10, 1);
        const wallMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x3b82f6,
            transparent: true,
            opacity: 0.3
        });
        const backWallMesh = new THREE.Mesh(wallGeometry, wallMaterial);
        backWallMesh.position.copy(backWallBody.position);
        backWallMesh.castShadow = true;
        scene.add(backWallMesh);

        // Objects array to track bodies and meshes
        const objects = [];

        // Materials
        const objectMaterial = new THREE.MeshStandardMaterial({
            color: 0x60a5fa,
            metalness: 0.7,
            roughness: 0.3
        });

        // Physics controls setup
        const gravitySlider = document.getElementById('gravity-slider');
        const frictionSlider = document.getElementById('friction-slider');
        const restitutionSlider = document.getElementById('restitution-slider');
        const gravityValue = document.getElementById('gravity-value');
        const frictionValue = document.getElementById('friction-value');
        const restitutionValue = document.getElementById('restitution-value');

        // Update physics properties
        function updatePhysicsProperties() {
            const gravity = parseFloat(gravitySlider.value);
            const friction = parseFloat(frictionSlider.value);
            const restitution = parseFloat(restitutionSlider.value);

            // Update display values
            gravityValue.textContent = gravity.toFixed(2);
            frictionValue.textContent = friction.toFixed(2);
            restitutionValue.textContent = restitution.toFixed(2);

            // Update world gravity
            world.gravity.set(0, -gravity, 0);

            // Update contact material properties
            defaultContact.friction = friction;
            defaultContact.restitution = restitution;

            // Update existing objects
            objects.forEach(obj => {
                const material = obj.body.material;
                material.friction = friction;
                material.restitution = restitution;
            });
        }

        // Add event listeners for sliders
        gravitySlider.addEventListener('input', updatePhysicsProperties);
        frictionSlider.addEventListener('input', updatePhysicsProperties);
        restitutionSlider.addEventListener('input', updatePhysicsProperties);

        // Create object function
        function createObject(shape, geometry) {
            const body = new CANNON.Body({
                mass: 1,
                material: defaultMaterial
            });
            body.addShape(shape);
            body.position.set(
                Math.random() * 2 - 1,
                5,
                Math.random() * 2 - 1
            );
            // Add random rotation
            body.quaternion.setFromEuler(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );
            world.addBody(body);

            const mesh = new THREE.Mesh(geometry, objectMaterial);
            mesh.castShadow = true;
            scene.add(mesh);

            objects.push({ body, mesh });
        }

        // Add Cube button
        document.getElementById('add-cube').addEventListener('click', function() {
            const size = 1;
            const shape = new CANNON.Box(new CANNON.Vec3(size/2, size/2, size/2));
            const geometry = new THREE.BoxGeometry(size, size, size);
            createObject(shape, geometry);
        });

        // Add Sphere button
        document.getElementById('add-sphere').addEventListener('click', function() {
            const radius = 0.5;
            const shape = new CANNON.Sphere(radius);
            const geometry = new THREE.SphereGeometry(radius, 32, 32);
            createObject(shape, geometry);
        });

        // Add Cylinder button
        document.getElementById('add-cylinder').addEventListener('click', function() {
            const radius = 0.5;
            const height = 1;
            const shape = new CANNON.Cylinder(radius, radius, height, 20);
            const geometry = new THREE.CylinderGeometry(radius, radius, height, 32);
            createObject(shape, geometry);
        });

        // Toggle Gravity
        document.getElementById('toggle-gravity').addEventListener('click', function() {
            const currentGravity = parseFloat(gravitySlider.value);
            gravitySlider.value = -currentGravity;
            updatePhysicsProperties();
        });

        // Reset button
        document.getElementById('reset-simulation').addEventListener('click', function() {
            objects.forEach(obj => {
                world.remove(obj.body);
                scene.remove(obj.mesh);
            });
            objects.length = 0;
        });

        // Animation loop
        const timeStep = 1 / 60;
        function animate() {
            requestAnimationFrame(animate);

            world.step(timeStep);

            objects.forEach(obj => {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', function() {
            const width = container.clientWidth;
            const height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        // Prevent scrolling when interacting with the simulation
        renderer.domElement.addEventListener('mousewheel', function(e) {
            e.preventDefault();
        });
    });
</script>
</body>
</html>
