<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysLab - Rigid Body Simulation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/5.0.0/babylon.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/5.0.0/havok.js"></script>
    <style>
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }
        
        .simulation-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 70px);
            overflow: hidden;
        }
        
        .shape-palette {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            z-index: 10;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            user-select: none;
        }
        
        .shape-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: var(--radius-md);
            background-color: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        
        .shape-item:hover {
            background-color: rgba(var(--primary-color-rgb), 0.1);
        }
        
        .shape-item:last-child {
            margin-bottom: 0;
        }
        
        .shape-icon {
            width: 30px;
            height: 30px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .shape-icon i {
            font-size: 20px;
            color: var(--primary-color);
        }
        
        .shape-label {
            font-weight: 500;
        }
        
        .properties-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            z-index: 10;
            border: 1px solid var(--border-color);
            transform: translateX(350px);
            transition: transform 0.3s ease;
            user-select: none;
        }
        
        .properties-panel.active {
            transform: translateX(0);
        }
        
        .properties-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .properties-title h3 {
            margin: 0;
            font-size: 1.2rem;
        }
        
        .close-properties {
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-color);
        }
        
        .property-group {
            margin-bottom: 15px;
        }
        
        .property-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .property-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--background-color);
            color: var(--text-color);
            font-size: 0.9rem;
        }
        
        .property-slider {
            width: 100%;
            margin-top: 5px;
            -webkit-appearance: none;
            height: 5px;
            border-radius: var(--radius-full);
            background: var(--border-color);
            outline: none;
        }
        
        .property-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }
        
        .property-slider::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }
        
        .simulation-actions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        
        .action-button {
            padding: 10px 20px;
            border-radius: var(--radius-md);
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        
        .action-button:hover {
            background-color: var(--primary-color);
            color: white;
        }
        
        .action-button i {
            font-size: 1rem;
        }
        
        .shape-preview {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.7;
            display: none;
        }
        
        .shape-preview i {
            font-size: 30px;
            color: var(--primary-color);
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
        }
        
        /* Additional simulation-specific CSS variables */
        :root {
            --primary-color-rgb: 58, 134, 255;
        }
        
        [data-theme="dark"] {
            --primary-color-rgb: 77, 159, 255;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>PhysLab</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="simulations.html" class="active">Simulations</a></li>
                <li><a href="about.html">About Us</a></li>
                <li class="theme-toggle">
                    <label class="toggle-switch">
                        <input type="checkbox" id="theme-toggle-btn">
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-text">Dark Mode</span>
                </li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>

    <div class="simulation-container">
        <canvas id="renderCanvas"></canvas>
        
        <div class="shape-palette">
            <div class="shape-item" data-shape="box">
                <div class="shape-icon">
                    <i class="fas fa-cube"></i>
                </div>
                <div class="shape-label">Cube</div>
            </div>
            <div class="shape-item" data-shape="cylinder">
                <div class="shape-icon">
                    <i class="fas fa-database"></i>
                </div>
                <div class="shape-label">Cylinder</div>
            </div>
            <div class="shape-item" data-shape="sphere">
                <div class="shape-icon">
                    <i class="fas fa-circle"></i>
                </div>
                <div class="shape-label">Sphere</div>
            </div>
        </div>
        
        <!-- Shape preview for drag and drop -->
        <div class="shape-preview" id="shapePreview">
            <i class="fas fa-cube"></i>
        </div>
        
        <div class="properties-panel" id="propertiesPanel">
            <div class="properties-title">
                <h3>Properties</h3>
                <div class="close-properties">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            
            <div class="property-group">
                <label class="property-label">Mass</label>
                <input type="number" class="property-input" id="mass-input" value="1" min="0.1" max="100" step="0.1">
                <input type="range" class="property-slider" id="mass-slider" min="0.1" max="100" value="1" step="0.1">
            </div>
            
            <div class="property-group">
                <label class="property-label">Friction</label>
                <input type="number" class="property-input" id="friction-input" value="0.2" min="0" max="1" step="0.05">
                <input type="range" class="property-slider" id="friction-slider" min="0" max="1" value="0.2" step="0.05">
            </div>
            
            <div class="property-group">
                <label class="property-label">Restitution (Bounciness)</label>
                <input type="number" class="property-input" id="restitution-input" value="0.7" min="0" max="1" step="0.05">
                <input type="range" class="property-slider" id="restitution-slider" min="0" max="1" value="0.7" step="0.05">
            </div>
        </div>
        
        <div class="simulation-actions">
            <button class="action-button" id="reset-scene">
                <i class="fas fa-redo"></i> Reset Scene
            </button>
            <button class="action-button" id="toggle-gravity">
                <i class="fas fa-arrow-down"></i> Toggle Gravity
            </button>
        </div>
    </div>

    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle-btn');
        const body = document.body;

        // Check for saved theme preference
        if (localStorage.getItem('theme') === 'dark') {
            body.setAttribute('data-theme', 'dark');
            themeToggle.checked = true;
        }

        themeToggle.addEventListener('change', function() {
            if (this.checked) {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            }
        });

        // Mobile navigation toggle
        const burger = document.querySelector('.burger');
        const nav = document.querySelector('.nav-links');

        burger.addEventListener('click', function() {
            nav.classList.toggle('active');
            // Animate burger menu
            this.classList.toggle('toggle');
        });

        // Babylon.js Physics Simulation
        window.addEventListener('DOMContentLoaded', async function() {
            // Get the canvas element and engine
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true);
            
            // Storage for all created meshes
            const sceneMeshes = [];
            let selectedMesh = null;
            const propertiesPanel = document.getElementById('propertiesPanel');
            let gravityEnabled = true;
            
            // Shape preview element
            const shapePreview = document.getElementById('shapePreview');
            let currentDragShape = null;
            
            // Utility function to generate a random color
            const getRandomColor = () => {
                const h = 360 * Math.random();
                const s = (50 + 50 * Math.random());
                const l = (65 + 10 * Math.random());
                return `hsl(${h}, ${s}%, ${l}%)`;
            };
            
            // Create our scene
            const createScene = async function() {
                const scene = new BABYLON.Scene(engine);
                
                // Set up basic environment
                const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 15, new BABYLON.Vector3(0, 3, 0), scene);
                camera.attachControl(canvas, true);
                camera.upperBetaLimit = Math.PI / 2.2;
                camera.lowerRadiusLimit = 5;
                camera.upperRadiusLimit = 50;
                
                // Add lights
                const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
                light.intensity = 0.7;
                
                const directionalLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-2, -5, 2), scene);
                directionalLight.intensity = 0.5;
                
                // Create environment
                const environmentTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/environmentSpecular.env", scene);
                scene.environmentTexture = environmentTexture;
                scene.createDefaultSkybox(environmentTexture, true, 1000);
                
                // Create ground
                const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 50, height: 50}, scene);
                const groundMaterial = new BABYLON.StandardMaterial("groundMat", scene);
                groundMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                groundMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                ground.material = groundMaterial;
                ground.position.y = 0;
                ground.receiveShadows = true;
                
                // Enable shadows
                const shadowGenerator = new BABYLON.ShadowGenerator(1024, directionalLight);
                shadowGenerator.useBlurExponentialShadowMap = true;
                shadowGenerator.blurKernel = 32;
                
                // Initialize Havok Physics
                const havokInstance = await HavokPhysics();
                const havokPlugin = new BABYLON.HavokPlugin(true, havokInstance);
                scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), havokPlugin);
                
                // Add physics to ground
                ground.physicsImpostor = new BABYLON.PhysicsImpostor(
                    ground, 
                    BABYLON.PhysicsImpostor.BoxImpostor, 
                    { mass: 0, friction: 0.2, restitution: 0.7 }, 
                    scene
                );
                
                // Helper function to create physics objects
                const createPhysicsObject = (shapeType, position) => {
                    let mesh;
                    let impostorType;
                    const color = getRandomColor();
                    const material = new BABYLON.StandardMaterial("objectMat", scene);
                    material.diffuseColor = BABYLON.Color3.FromHexString(color);
                    
                    // Create different shapes based on type
                    switch(shapeType) {
                        case "box":
                            mesh = BABYLON.MeshBuilder.CreateBox("box", {size: 1}, scene);
                            impostorType = BABYLON.PhysicsImpostor.BoxImpostor;
                            break;
                        case "cylinder":
                            mesh = BABYLON.MeshBuilder.CreateCylinder("cylinder", {height: 1, diameter: 1}, scene);
                            impostorType = BABYLON.PhysicsImpostor.CylinderImpostor;
                            break;
                        case "sphere":
                            mesh = BABYLON.MeshBuilder.CreateSphere("sphere", {diameter: 1}, scene);
                            impostorType = BABYLON.PhysicsImpostor.SphereImpostor;
                            break;
                    }
                    
                    mesh.material = material;
                    mesh.position = position || new BABYLON.Vector3(0, 5, 0);
                    
                    // Add physics properties
                    mesh.physicsImpostor = new BABYLON.PhysicsImpostor(
                        mesh, 
                        impostorType, 
                        { mass: 1, friction: 0.2, restitution: 0.7 }, 
                        scene
                    );
                    
                    // Add shadow
                    shadowGenerator.addShadowCaster(mesh);
                    
                    // Store metadata
                    mesh.shapeType = shapeType;
                    
                    // Add to array for tracking
                    sceneMeshes.push(mesh);
                    
                    return mesh;
                };
                
                // Modified drag and drop approach with click-based interaction
                const shapePalette = document.querySelectorAll('.shape-item');
                
                // Handle shape item mouse down
                shapePalette.forEach(item => {
                    item.addEventListener('mousedown', function(e) {
                        e.preventDefault(); // Prevent text selection
                        
                        const shapeType = this.getAttribute('data-shape');
                        currentDragShape = shapeType;
                        
                        // Update preview icon
                        let iconClass;
                        switch(shapeType) {
                            case "box": iconClass = "fa-cube"; break;
                            case "cylinder": iconClass = "fa-database"; break;
                            case "sphere": iconClass = "fa-circle"; break;
                        }
                        
                        shapePreview.innerHTML = `<i class="fas ${iconClass}"></i>`;
                        shapePreview.style.display = 'block';
                        
                        // Position the preview at the cursor
                        shapePreview.style.left = `${e.clientX - 15}px`;
                        shapePreview.style.top = `${e.clientY - 15}px`;
                        
                        // Add mousemove and mouseup event listeners to the document
                        document.addEventListener('mousemove', handleMouseMove);
                        document.addEventListener('mouseup', handleMouseUp);
                    });
                });
                
                // Handle mouse move during drag
                const handleMouseMove = function(e) {
                    e.preventDefault();
                    
                    // Update the preview position
                    shapePreview.style.left = `${e.clientX - 15}px`;
                    shapePreview.style.top = `${e.clientY - 15}px`;
                };
                
                // Handle mouse up / drop
                const handleMouseUp = function(e) {
                    e.preventDefault();
                    
                    // Only process if we were dragging something
                    if (currentDragShape) {
                        // Hide the preview
                        shapePreview.style.display = 'none';
                        
                        // Get the canvas bounds
                        const canvasRect = canvas.getBoundingClientRect();
                        
                        // Check if we're dropping onto the canvas
                        if (
                            e.clientX >= canvasRect.left && 
                            e.clientX <= canvasRect.right && 
                            e.clientY >= canvasRect.top && 
                            e.clientY <= canvasRect.bottom
                        ) {
                            // Convert screen coordinates to canvas coordinates
                            const dropX = e.clientX - canvasRect.left;
                            const dropY = e.clientY - canvasRect.top;
                            
                            // Convert to 3D position using raycasting
                            const pickResult = scene.pick(dropX, dropY);
                            let position;
                            
                            if (pickResult.hit) {
                                position = pickResult.pickedPoint.clone();
                                position.y += 1; // Place a bit above the hit point
                            } else {
                                // If no hit, place in front of camera
                                const forward = camera.getTarget().subtract(camera.position).normalize();
                                position = camera.position.add(forward.scale(10));
                            }
                            
                            // Create the physics object
                            createPhysicsObject(currentDragShape, position);
                        }
                        
                        // Reset drag state
                        currentDragShape = null;
                    }
                    
                    // Remove document event listeners
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                };
                
                // Selection and Property Panel Logic
                let highlightLayer = new BABYLON.HighlightLayer("hl", scene);
                
                // Handle object selection
                scene.onPointerDown = function(evt, pickResult) {
                    // Don't select objects if we're dragging
                    if (currentDragShape) return;
                    
                    // Check if we picked a mesh that is not the ground
                    if (pickResult.hit && pickResult.pickedMesh !== ground) {
                        // Remove highlight from previously selected mesh
                        if (selectedMesh) {
                            highlightLayer.removeAllMeshes();
                        }
                        
                        // Set new selected mesh
                        selectedMesh = pickResult.pickedMesh;
                        
                        // Highlight the selected mesh
                        highlightLayer.addMesh(selectedMesh, BABYLON.Color3.FromHexString("#4d9fff"));
                        
                        // Update property panel values
                        document.getElementById('mass-input').value = selectedMesh.physicsImpostor.getParam("mass");
                        document.getElementById('mass-slider').value = selectedMesh.physicsImpostor.getParam("mass");
                        document.getElementById('friction-input').value = selectedMesh.physicsImpostor.getParam("friction");
                        document.getElementById('friction-slider').value = selectedMesh.physicsImpostor.getParam("friction");
                        document.getElementById('restitution-input').value = selectedMesh.physicsImpostor.getParam("restitution");
                        document.getElementById('restitution-slider').value = selectedMesh.physicsImpostor.getParam("restitution");
                        
                        // Show property panel
                        propertiesPanel.classList.add('active');
                    } else if (pickResult.pickedMesh === ground) {
                        // If clicking on ground, deselect
                        if (selectedMesh) {
                            highlightLayer.removeAllMeshes();
                            selectedMesh = null;
                            propertiesPanel.classList.remove('active');
                        }
                    }
                };
                
                // Close properties panel
                document.querySelector('.close-properties').addEventListener('click', function() {
                    propertiesPanel.classList.remove('active');
                    if (selectedMesh) {
                        highlightLayer.removeAllMeshes();
                        selectedMesh = null;
                    }
                });
                
                // Property change handlers
                // Mass property
                document.getElementById('mass-input').addEventListener('change', function() {
                    if (selectedMesh) {
                        const mass = parseFloat(this.value);
                        selectedMesh.physicsImpostor.setMass(mass);
                        document.getElementById('mass-slider').value = mass;
                    }
                });
                
                document.getElementById('mass-slider').addEventListener('input', function() {
                    if (selectedMesh) {
                        const mass = parseFloat(this.value);
                        selectedMesh.physicsImpostor.setMass(mass);
                        document.getElementById('mass-input').value = mass;
                    }
                });
                
                // Friction property
                document.getElementById('friction-input').addEventListener('change', function() {
                    if (selectedMesh) {
                        const friction = parseFloat(this.value);
                        selectedMesh.physicsImpostor.setParam("friction", friction);
                        document.getElementById('friction-slider').value = friction;
                    }
                });
                
                document.getElementById('friction-slider').addEventListener('input', function() {
                    if (selectedMesh) {
                        const friction = parseFloat(this.value);
                        selectedMesh.physicsImpostor.setParam("friction", friction);
                        document.getElementById('friction-input').value = friction;
                    }
                });
                
                // Restitution property
                document.getElementById('restitution-input').addEventListener('change', function() {
                    if (selectedMesh) {
                        const restitution = parseFloat(this.value);
                        selectedMesh.physicsImpostor.setParam("restitution", restitution);
                        document.getElementById('restitution-slider').value = restitution;
                    }
                });
                
                document.getElementById('restitution-slider').addEventListener('input', function() {
                    if (selectedMesh) {
                        const restitution = parseFloat(this.value);
                        selectedMesh.physicsImpostor.setParam("restitution", restitution);
                        document.getElementById('restitution-input').value = restitution;
                    }
                });
                
                // Reset scene button
                document.getElementById('reset-scene').addEventListener('click', function() {
                    // Remove all meshes except ground
                    while (sceneMeshes.length > 0) {
                        const mesh = sceneMeshes.pop();
                        mesh.dispose();
                    }
                    
                    // Reset selection
                    if (selectedMesh) {
                        highlightLayer.removeAllMeshes();
                        selectedMesh = null;
                        propertiesPanel.classList.remove('active');
                    }
                });
                
                // Toggle gravity button
                document.getElementById('toggle-gravity').addEventListener('click', function() {
                    gravityEnabled = !gravityEnabled;
                    
                    if (gravityEnabled) {
                        scene.getPhysicsEngine().setGravity(new BABYLON.Vector3(0, -9.81, 0));
                        this.innerHTML = '<i class="fas fa-arrow-down"></i> Toggle Gravity';
                    } else {
                        scene.getPhysicsEngine().setGravity(new BABYLON.Vector3(0, 0, 0));
                        this.innerHTML = '<i class="fas fa-arrows-alt"></i> Toggle Gravity';
                    }
                });
                
                return scene;
            };
            
            // Create the scene
            const scene = await createScene();
            
            // Run the render loop
            engine.runRenderLoop(function() {
                scene.render();
            });
            
            // Handle browser resize
            window.addEventListener('resize', function() {
                engine.resize();
            });
        });
    </script>
</body>
</html>
